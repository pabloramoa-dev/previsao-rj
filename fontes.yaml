# Registro de fontes do @previsaorj — Plano Mestre v1.1, secoes 5.1, 12.3 e 17.3.
#
# Regra dura do projeto: o Alerta Rio NAO e fonte meteorologica.
# O COR entra so para operacao/mobilidade/evento; qualquer campo meteorologico
# vindo dele deve ser descartado no normalizador.
#
# Toda fonte declara timeout, retries limitados, TTL de cache e politica de
# fallback. Fonte desligada (enabled: false) nao vira dado zero silencioso:
# entra no snapshot com status "not_collected" (secao 17.3).

meta:
  version: 1
  updated_at: "2026-09-07"

defaults:
  timeout_seconds: 25
  retries: 2
  backoff_seconds: 3
  cache_ttl_minutes: 30

sources:

  open_meteo_forecast:
    layer: previsao
    enabled: true
    role: principal
    endpoint: "https://api.open-meteo.com/v1/forecast"
    models:
      primary: ecmwf_ifs025          # ECMWF IFS, base meteorologica do projeto
      secondary: [gfs_seamless, icon_seamless]
    resolution_km: 9
    timeout_seconds: 25
    retries: 2
    cache_ttl_minutes: 30
    freshness_ttl_minutes: 120       # snapshot mais velho que isso nao publica
    fallback: secondary_model        # se o ECMWF falhar, usa modelo secundario e marca fallback_used

  open_meteo_marine:
    layer: mar
    enabled: false                   # entra na etapa "Vai dar praia?" (secao 10.1)
    role: principal
    endpoint: "https://marine-api.open-meteo.com/v1/marine"
    timeout_seconds: 25
    retries: 2
    cache_ttl_minutes: 60
    freshness_ttl_minutes: 240
    fallback: none

  inmet_estacoes:
    layer: observacao
    enabled: false                   # ligar apos validar formato e QC das estacoes
    role: principal
    endpoint: "https://apitempo.inmet.gov.br"
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 20
    freshness_ttl_minutes: 180
    fallback: cemaden

  cemaden_pluviometros:
    layer: chuva_observada
    enabled: false                   # dado bruto: exige validacao de faixa (secao 5.3)
    role: complementar
    endpoint: "http://sjc.salvar.cemaden.gov.br"
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 20
    freshness_ttl_minutes: 180
    quality_control:
      max_hourly_mm: 120             # acima disso, tratar como suspeito e nao virar manchete
      require_timestamp_utc: true
    fallback: inmet_estacoes

  inea_balneabilidade:
    layer: balneabilidade
    enabled: false
    role: oficial_unico              # sem estimativa propria (secao 5.1)
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 720
    freshness_ttl_minutes: 4320      # 3 dias: boletim mais velho nao vai ao ar
    fallback: none
    display_rule: "sempre exibir a data do boletim"

  marinha_dhn:
    layer: aviso_maritimo
    enabled: false
    role: prevalece                  # aviso oficial vence indice recreativo (secao 5.3)
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 60
    freshness_ttl_minutes: 720
    fallback: none

  cor_rio:
    layer: mobilidade
    enabled: false
    role: operacional
    weather_use: forbidden           # nunca fornece meteorologia ao sistema
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 15
    freshness_ttl_minutes: 120
    fallback: none

  barcas_rio:
    layer: mobilidade
    enabled: false
    role: operacional
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 15
    freshness_ttl_minutes: 120
    fallback: none
    omit_rule: "sem atualizacao confiavel, omitir status operacional e publicar so o tempo"

  riotur_eventos:
    layer: eventos
    enabled: false
    role: calendario_oficial
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 720
    freshness_ttl_minutes: 10080
    fallback: eventos_manuais

  eventos_manuais:
    layer: eventos
    enabled: true
    role: fallback_versionado
    file: "config/eventos_manuais.yaml"
    requires_expiration: true        # expires_at obrigatorio (secao 18)

  futebol_calendario:
    layer: futebol
    enabled: false
    role: complementar
    timeout_seconds: 25
    retries: 1
    cache_ttl_minutes: 360
    freshness_ttl_minutes: 1440
    fallback: none

# Fontes explicitamente proibidas como origem meteorologica.
forbidden_weather_sources:
  - alerta_rio
  - cor_rio
