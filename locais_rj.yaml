# Cobertura hiperlocal do @previsaorj — Plano Mestre v1.1, capitulo 4.
#
# Hierarquia: REGIAO -> MUNICIPIO -> ZONA METEOROLOGICA -> BAIRROS / POIs / ALIASES.
#
# As coordenadas sao centroides aproximados de bairro. O modelo de referencia
# (ECMWF IFS via Open-Meteo) trabalha em grade de ~9 km: estas coordenadas
# servem para posicionar o ponto dentro da zona, NUNCA para afirmar diferenca
# entre ruas vizinhas (Plano Mestre, secao 4.1).
#
# spatial_fit: quanto o ponto e representativo da zona em que esta.
#   alto  = bairro plano, homogeneo, longe de fronteira de relevo/costa
#   medio = transicao (encosta, borda de macico, entrada de baia)
#   baixo = microclima marcado (Alto da Boa Vista, Guaratiba, Itacoatiara)
# Alimenta o criterio "adequacao espacial" do score de confianca (secao 5.2).

meta:
  version: 1
  region: rio_metropolitano
  timezone: America/Sao_Paulo
  updated_at: "2026-09-07"
  source_note: "Centroides aproximados de bairro; resolucao do modelo ~9 km."

municipalities:
  rio_de_janeiro:
    name: "Rio de Janeiro"
    uf: RJ
    default_ambiguous: true   # "Centro" e "Barra" exigem desambiguacao
  niteroi:
    name: "Niterói"
    uf: RJ
  duque_de_caxias: {name: "Duque de Caxias", uf: RJ}
  nova_iguacu: {name: "Nova Iguaçu", uf: RJ}
  sao_joao_de_meriti: {name: "São João de Meriti", uf: RJ}
  belford_roxo: {name: "Belford Roxo", uf: RJ}
  nilopolis: {name: "Nilópolis", uf: RJ}
  mesquita: {name: "Mesquita", uf: RJ}

# Zonas meteorologicas editoriais (secao 4.2). "decisions" e o que a zona
# costuma decidir no dia a dia; o motor editorial usa isso para escolher pauta.
zones:
  zona_sul:
    name: "Zona Sul"
    municipality: rio_de_janeiro
    coastal: true
    decisions: [praia, vento, chuva_de_passagem, corrida, por_do_sol, eventos]
  grande_tijuca:
    name: "Grande Tijuca"
    municipality: rio_de_janeiro
    coastal: false
    orographic: true
    decisions: [chuva_orografica, jogo, deslocamento, temperatura]
  centro:
    name: "Centro"
    municipality: rio_de_janeiro
    coastal: false
    decisions: [trabalho, eventos, calor_urbano, interdicoes]
  zona_norte:
    name: "Zona Norte"
    municipality: rio_de_janeiro
    coastal: false
    decisions: [calor, chuva_fim_de_tarde, deslocamento]
  jacarepagua:
    name: "Jacarepaguá"
    municipality: rio_de_janeiro
    coastal: false
    decisions: [calor, pancadas, acesso_barra_zona_sul]
  barra_recreio:
    name: "Barra e Recreio"
    municipality: rio_de_janeiro
    coastal: true
    decisions: [praia, vento, ondas, eventos, calor]
  zona_oeste:
    name: "Zona Oeste"
    municipality: rio_de_janeiro
    coastal: true
    decisions: [extremos_de_calor, pancadas, deslocamento, praia_guaratiba]
  niteroi_baia:
    name: "Niterói - Baía"
    municipality: niteroi
    coastal: true
    decisions: [barcas, vento, chuva, orla, deslocamento]
  niteroi_oceanica:
    name: "Niterói - Oceânica"
    municipality: niteroi
    coastal: true
    decisions: [praia, mar, vento, balneabilidade]
  baixada:
    name: "Baixada Fluminense"
    municipality: null   # zona multimunicipal
    coastal: false
    decisions: [calor, chuva, deslocamento, eventos_locais]

