name: Health — Meta / @previsaorj
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meta-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Verificar destino sem publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          EXPECTED_IG_USERNAME: previsaorj
        run: python -c "from src.previsao_rj.publish.instagram import verify_destination; print(verify_destination().get('username'))"
