name: Coletar dados — Previsão RJ (sem publicação)

# Fase 1 do Plano Mestre. Só coleta, normaliza e mostra o snapshot como artifact.
# Não usa secret, não cria container na Meta, não publica nada.
# O schedule fica desligado até a Fase 7 (§13.2 e gate de produção).

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Amostra: 1 = âncoras do Reel-base, 2 inclui zonas de apoio"
        type: choice
        options: ["1", "2"]
        default: "1"

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Dependências
        run: pip install -r requirements/test.txt

      - name: Isolamento e testes
        run: |
          python scripts/isolation_guard.py
          python -m pytest -q

      - name: Coletar e normalizar
        run: python -m scripts.collect_live output/snapshot.json --tier ${{ inputs.tier }}

      - name: Resumo legível
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('output/snapshot.json', encoding='utf-8'))
          c = d['confidence']
          print(f"## Snapshot {d['forecast']['today']['date']}\n")
          print(f"- modelos: `{'`, `'.join(d['forecast']['models'])}` "
                f"(principal: `{d['forecast']['primary_model']}`)")
          print(f"- confiança: **{c['score']}/{c['max_possible']}** ({c['level']})")
          print(f"- linguagem categórica liberada: "
                f"{'sim' if c['gates']['allow_categorical_language'] else 'NÃO'}")
          print(f"- Reel de alerta liberado: "
                f"{'sim' if c['gates']['allow_alert_reel'] else 'NÃO'}")
          print(f"- fallback usado: {'sim' if d['fallback_used'] else 'não'}\n")
          print("| local | zona | mín | máx | chuva | janela |")
          print("|---|---|---|---|---|---|")
          for e in d['forecast']['today']['locations']:
              w = e['rain_window']
              janela = f"{w['start']}–{w['end']} (pico {w['peak_probability_pct']}%)" if w else "—"
              print(f"| {e['name']} | {e['zone']} | {e['min_c']}° | {e['max_c']}° | "
                    f"{e['rain_probability_pct']}% | {janela} |")
          print("\n### Fontes\n")
          for s in d['sources']:
              print(f"- `{s['name']}`: {s['status']}"
                    + (" **[fallback]**" if s['fallback_used'] else "")
                    + (f" — {s['detail']}" if s['detail'] else ""))
          print("\n### Confiança, critério a critério\n")
          for nota in c['notes']:
              print(f"- {nota}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: output/snapshot.json
          retention-days: 14
