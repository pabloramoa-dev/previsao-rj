name: Bootstrap Fase 1 (uso unico)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Conferir o pacote
        run: |
          test -f fase1_payload.tgz || { echo "fase1_payload.tgz nao esta na raiz"; exit 1; }
          echo "e24fc71f45b28a1a7991096b3ccc41561e8d580aa1732c662807f253202d6cf8  fase1_payload.tgz" | sha256sum -c -

      - name: Extrair nos caminhos certos
        run: tar -xzf fase1_payload.tgz -C .

      - name: Limpar a raiz e o arquivo substituido
        run: |
          rm -f fase1_payload.tgz LEIA_ANTES.md download
          rm -f config/locations.yml
          rm -f "__init__ (1).py" __init__.py
          rm -f DADOS.md IMPLEMENTATION_STATUS.md RELEASE_CHECKLIST.md
          rm -f base.py ci.yml coletar_dados.yml collect_live.py confidence.py
          rm -f config.py conftest.py fontes.yaml isolation_guard.py locais_rj.yaml
          rm -f observations.py open_meteo.py open_meteo_raw.json resolver.py snapshot.py
          rm -f test_confidence.py test_geo_resolver.py test_isolation.py
          rm -f test_locations.py test_snapshot_schema.py
          rm -rf fase1_payload

      - name: Isolamento e testes
        run: |
          pip install -r requirements/test.txt
          python scripts/isolation_guard.py
          python -m pytest -q

      - name: Conferir que a raiz ficou limpa
        run: |
          ls -A
          test ! -f locais_rj.yaml || { echo "ainda ha arquivo solto na raiz"; exit 1; }
          test -f config/locais_rj.yaml || { echo "locais_rj.yaml nao chegou em config/"; exit 1; }
          test -f src/previsao_rj/quality/confidence.py || { echo "quality/ nao chegou"; exit 1; }

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fase 1: 10 zonas, coletor multi-modelo, schema 12.2, score de confianca e resolver"
          git push
