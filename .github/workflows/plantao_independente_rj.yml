name: Plantão independente RJ — 10h00, tempo severo
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Renderizar sem publicar (padrão seguro)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: plantao-rj-independente
  cancel-in-progress: false
jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: '1'
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas de monitoramento
        run: pip install 'requests>=2.31,<3'
      - name: Validar sintaxe independente
        run: python -m compileall -q plantao_rj/
      - name: Consultar INMET e ICON GFS em 10 cidades
        id: consulta
        run: python -m plantao_rj.coletar
      - name: Registro da evidência e decisão
        if: always()
        run: |
          if test -s output/plantao_rj/consulta.json; then
            python - <<'PY'
          import json,os
          r=json.load(open("output/plantao_rj/consulta.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              print("**Risco validado:**",r["publicar"],file=f)
              print("**Primeiro evento:**",r["eventos"][:1],file=f)
              print("**Avisos oficiais:**",len(r["avisos_oficiais"]),file=f)
          PY
          fi
      - name: Sem risco confirmado, sem publicação
        if: steps.consulta.outputs.publicar != 'true'
        run: echo 'Nenhum alerta elegível; não renderizar ou publicar.' >> "$GITHUB_STEP_SUMMARY"
      - name: Instalar renderizador independente
        if: steps.consulta.outputs.publicar == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core
          pip install 'pillow>=10,<13' 'numpy>=1.26,<3' kokoro-onnx soundfile
      - name: Gerar vídeo próprio 1080x1920 com Bia Kokoro
        if: steps.consulta.outputs.publicar == 'true'
        run: python -m plantao_rj.renderizar
      - name: Hospedar MP4 em Release do canal
        id: release
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="plantao-rj-$GITHUB_RUN_ID"
          gh release create "$tag" output/plantao_rj/ALERTA.mp4 output/plantao_rj/CAPA.jpg \
            --title "$tag" --notes "Alerta meteorológico com fonte e validade verificadas"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ALERTA.mp4" >> "$GITHUB_OUTPUT"
      - name: Publicar Reel e Story somente com risco validado
        id: publicar
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m plantao_rj.publicar --url "${{ steps.release.outputs.url }}"
      - name: Preservar recibos para bloqueio de duplicados
        if: always() && steps.release.outcome == 'success'
        run: |
          if test -f data/plantao_rj_publicacoes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/plantao_rj_publicacoes.json
            if ! git diff --cached --quiet; then
              git commit -m 'Recibos do plantão independente RJ [skip ci]'
              git pull --rebase
              git push
            fi
          fi
      - name: Limpar Release somente após dupla publicação confirmada
        if: steps.publicar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.release.outputs.tag }}" --cleanup-tag --yes
      - name: Preservar provas, mídia e recibos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantao-rj-${{ github.run_id }}
          path: |
            output/plantao_rj/
            data/plantao_rj_publicacoes.json
          if-no-files-found: warn
          retention-days: 3
