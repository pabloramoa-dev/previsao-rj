name: Reel da noite — Previsão RJ

# Publicação diária da NOITE (18h): Bia da Orla com a previsão de AMANHÃ.
# O Reel da manhã (6h, Bira com a previsão do dia) é o `reel_manha.yml`.
# Cada turno tem a sua trava: o da noite só conta publicação da noite
# (formato `amanha_no_rio`). Tudo o que está explicado abaixo sobre cron,
# trava e publicação vale igual ao Reel da manhã.
#
# Por que TRÊS horários de cron e não um: o agendamento do GitHub atrasa. Em
# setembro/2026 o histórico agendado para 06:00 rodou às 12:17, e o
# agendamento do primeiro Reel (07:07 de 13/09) simplesmente não disparou. Com
# uma tentativa só, um atraso desses publica a previsão da manhã à tarde — ou
# não publica.
#
# Então são três tentativas antes das 6h e uma trava de idempotência: o job
# `trava` lê a fila versionada e, se já existe publicação com a data local de
# hoje, o Reel nem começa. A primeira tentativa que realmente disparar publica;
# as outras saem em segundos, sem instalar ffmpeg nem coletar nada.
#
# Cinto e suspensório, em três camadas: o job `trava`, o
# `escolher_pauta --exigir-inedito-hoje` (que relê a fila já atualizada) e o
# `publish.cli`, que recusa legenda equivalente já publicada. Mesmo que o
# commit da fila falhe, não sai Reel repetido.
#
# Chave geral: a variable AUTOMATION_ENABLED. Sem ela igual a 'true', nada
# roda. É o rollback de um clique, sem editar arquivo.

on:
  schedule:
    - cron: "30 19 * * *"  # 16:30 America/Sao_Paulo
    - cron: "0 20 * * *"   # 17:00 America/Sao_Paulo
    - cron: "30 20 * * *"  # 17:30 America/Sao_Paulo
  # GATILHO PRINCIPAL (desde 17/09/2026): cron-job.org às 17:40 (America/Sao_Paulo)
  # chama POST /repos/:owner/:repo/dispatches {"event_type":"reel_noite"} com um
  # token fine-grained só deste repo (Contents: write). Os três crons acima
  # ficam como reserva: em 17/09 o GitHub descartou os três.
  repository_dispatch:
    types: [reel_noite]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no @previsaorj? Desmarcado = só artifact"
        type: boolean
        default: true
      ignorar_trava:
        description: "Publicar mesmo que já tenha saído Reel hoje"
        type: boolean
        default: false

permissions:
  contents: write

# Mesmo grupo do publicar_manual.yml: nunca dois publicadores ao mesmo tempo.
concurrency:
  group: previsao-rj-publicacao
  cancel-in-progress: false

jobs:
  # Job separado, e não um passo: o que ele evita é justamente o custo dos
  # passos seguintes (apt, pip, Manim, Kokoro). Nas tentativas de cron em que
  # já saiu Reel, a execução inteira termina em segundos.
  trava:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pular: ${{ steps.conferir.outputs.pular }}
      publicar: ${{ steps.conferir.outputs.publicar }}
    steps:
      # Sempre a ponta da main, e NÃO o commit do disparo: um agendamento
      # atrasado que ficou esperando na fila de concorrência carregaria a fila
      # editorial antiga (sem o Reel que acabou de sair) e as três travas
      # deixariam passar um Reel repetido.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Já saiu Reel hoje?
        id: conferir
        env:
          EVENTO: ${{ github.event_name }}
          IN_PUBLICAR: ${{ inputs.publicar }}
          IN_IGNORAR: ${{ inputs.ignorar_trava }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib

          # As caixinhas do disparo manual só existem no disparo manual. Em cron
          # e em repository_dispatch não há `inputs`, e a combinação A && B || C
          # do GitHub devolve C quando B é false — "não publicar" viraria
          # "publicar". Por isso a decisão é tomada aqui, em Python.
          manual = os.environ['EVENTO'] == 'workflow_dispatch'
          publicar = os.environ.get('IN_PUBLICAR', '') != 'false' if manual else True
          ignorar = manual and os.environ.get('IN_IGNORAR', '') == 'true'

          hoje = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=-3))).date().isoformat()

          fila = pathlib.Path('data/editorial_queue.json')
          itens = json.loads(fila.read_text(encoding='utf-8')) if fila.exists() else []
          # Só conta o turno da NOITE: o Reel da manhã (Bira, previsão do
          # dia) não trava este Reel.
          ja = [i for i in itens
                if i.get('status') == 'published'
                and str(i.get('published_at', ''))[:10] == hoje
                and i.get('format') == 'amanha_no_rio']

          pular = 'sim' if (ja and not ignorar) else 'nao'
          print(f'hoje={hoje} pular={pular} publicar={publicar} '
                f'publicacoes_hoje={len(ja)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as saida:
              saida.write(f'pular={pular}\n')
              saida.write(f'publicar={str(publicar).lower()}\n')

          resumo = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          if pular == 'sim':
              resumo.write_text(
                  f'### Reel da noite de {hoje} já publicado\n\n'
                  f'- formato: `{ja[-1].get("format")}`\n'
                  f'- media_id: `{ja[-1].get("media_id")}`\n\n'
                  'Esta tentativa de cron encerrou sem falar com a Meta.\n',
                  encoding='utf-8')
          PY

  reel:
    needs: trava
    if: needs.trava.outputs.pular != 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # Visual do Reel: colagem de papel (vox) por padrão. Para voltar ao
      # visual anterior sem editar arquivo, crie a variable
      # PREVISAO_RJ_ESTILO=classico em Settings > Variables.
      PREVISAO_RJ_ESTILO: ${{ vars.PREVISAO_RJ_ESTILO || 'vox' }}
    steps:
      # Sempre a ponta da main, e NÃO o commit do disparo: um agendamento
      # atrasado que ficou esperando na fila de concorrência carregaria a fila
      # editorial antiga (sem o Reel que acabou de sair) e as três travas
      # deixariam passar um Reel repetido.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libpango1.0-dev libcairo2-dev pkg-config
          mkdir -p ~/.local/share/fonts/poppins
          for f in Poppins-Bold.ttf Poppins-Regular.ttf; do
            curl -fsSL --retry 3 -o ~/.local/share/fonts/poppins/$f https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/$f
          done
          fc-cache -f
          pip install -r requirements/test.txt -r requirements/characters.txt

      - name: Isolamento e testes
        run: |
          python scripts/isolation_guard.py
          python -m pytest -q

      - name: Coletar dados ao vivo
        run: python -m scripts.collect_live output/snapshot.json

      - name: Avaliar pautas e atualizar a fila
        run: python -m scripts.editorial_scan output/snapshot.json --out data/editorial_queue.json

      # Segunda camada da trava: aqui a fila já está atualizada pelo scan.
      - name: Escolher a pauta do dia
        id: pauta
        run: |
          python -m scripts.escolher_pauta \
            --queue data/editorial_queue.json \
            --out output/pauta.json \
            --turno noite \
            --exigir-inedito-hoje

      - name: Registrar por que não houve Reel
        if: steps.pauta.outputs.seguir != 'sim'
        run: |
          {
            echo "### Sem Reel nesta execução"
            echo "Motivo: \`${{ steps.pauta.outputs.motivo }}\`"
            echo "Nada foi enviado à Meta."
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------------- Reel

      - name: Render com a pauta escolhida
        if: steps.pauta.outputs.seguir == 'sim'
        run: |
          python -m src.previsao_rj.render.characters.pipeline \
            --snapshot output/snapshot.json \
            --personagem "${{ steps.pauta.outputs.personagem }}" \
            --format "${{ steps.pauta.outputs.formato }}" \
            --out output/REEL.mp4

      - name: Legenda da mesma pauta
        if: steps.pauta.outputs.seguir == 'sim'
        run: python -m scripts.build_caption output/snapshot.json output/LEGENDA.txt --pauta output/pauta.json

      - name: QA
        if: steps.pauta.outputs.seguir == 'sim'
        run: python scripts/qa_video.py output/REEL.mp4

      - name: Mostrar pauta, roteiro e legenda no resumo
        if: steps.pauta.outputs.seguir == 'sim'
        run: |
          {
            echo "## Pauta"
            echo "- formato: \`${{ steps.pauta.outputs.formato }}\`"
            echo "- tópico: \`${{ steps.pauta.outputs.topico }}\`"
            echo "- apresentador: \`${{ steps.pauta.outputs.personagem }}\`"
            echo "- dedupe_key: \`${{ steps.pauta.outputs.dedupe_key }}\`"
            echo '## Legenda'
            echo '```'
            cat output/LEGENDA.txt 2>/dev/null || echo '(sem legenda)'
            echo '```'
            echo '## Roteiro falado'
            echo '```'
            cat output/work_*/roteiro.txt 2>/dev/null || echo '(sem roteiro)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.pauta.outputs.seguir == 'sim'
        with:
          name: previsao-rj-reel-${{ github.run_id }}
          path: output/
          retention-days: 14

      # ---------------------------------------------------------- publicação

      - name: Verificar Meta e conta de destino
        if: ${{ steps.pauta.outputs.seguir == 'sim' && needs.trava.outputs.publicar == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: previsaorj
        run: python -c "from src.previsao_rj.publish.instagram import verify_destination; print('destino:',verify_destination().get('username'))"

      - name: Exigir repositório público para o Release que a Meta vai baixar
        if: ${{ steps.pauta.outputs.seguir == 'sim' && needs.trava.outputs.publicar == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh repo view "${{ github.repository }}" --json visibility -q .visibility)
          test "$V" = "PUBLIC" || { echo "PUBLICAÇÃO BLOQUEADA: Release de repo privado não é URL pública para a Meta."; exit 1; }

      - name: Hospedar MP4 em Release temporário
        if: ${{ steps.pauta.outputs.seguir == 'sim' && needs.trava.outputs.publicar == 'true' }}
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-noite-${{ github.run_id }}"
          gh release create "$TAG" output/REEL.mp4 --title "$TAG" --notes "Reel da noite @previsaorj"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/REEL.mp4" >> "$GITHUB_OUTPUT"

      - name: Publicar o Reel do dia
        if: ${{ steps.pauta.outputs.seguir == 'sim' && needs.trava.outputs.publicar == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: previsaorj
        run: |
          python -m src.previsao_rj.publish.cli \
            --video-url "${{ steps.media.outputs.url }}" \
            --caption-file output/LEGENDA.txt \
            --queue data/editorial_queue.json \
            --dedupe-key "${{ steps.pauta.outputs.dedupe_key }}" \
            --publish

      # A fila é o estado do publicador: precisa ser gravada mesmo quando a
      # publicação falhou no meio, senão o item fica 'publishing' só no runner.
      - name: Persistir a fila no repositório
        if: ${{ always() && steps.pauta.outputs.seguir == 'sim' }}
        run: |
          set -euo pipefail
          test -f data/editorial_queue.json || { echo "sem fila para persistir"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_queue.json
          if git diff --cached --quiet; then
            echo "fila sem mudanca"
            exit 0
          fi
          git commit -m "Fila editorial: estado apos execucao ${{ github.run_id }}"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # O MP4 só precisa existir enquanto a Meta baixa. Guardar um Release por
      # dia para sempre enche o repositório de mídia que ninguém usa.
      - name: Apagar Releases de Reel com mais de 7 dias
        if: ${{ always() && needs.trava.outputs.publicar == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMITE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt \
            --jq ".[] | select(.createdAt < \"$LIMITE\") | select(.tagName | test(\"^(reel|pilot)-\")) | .tagName" \
          | while read -r TAG; do
              [ -z "$TAG" ] && continue
              echo "apagando release $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes
            done
