name: Alerta severo RJ — 11h BRT
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas verificar e renderizar, sem publicar'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: previsao-rj-publicacao
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Sao_Paulo
      PYTHONPATH: .
      PREVISAO_RJ_HORA_ALVO: '11'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de detecção
        run: pip install requests
      - name: Validar sintaxe dos módulos
        run: python -m compileall -q tools/alerta_14h.py tools/alerta_14h_roteiro.py tools/render_alerta_14h.py tools/publicar_alerta_14h.py
      - name: Consultar INMET Defesa Civil ICON e GFS
        id: consulta
        run: python -m tools.alerta_14h
      - name: Registrar decisão
        if: always()
        run: |
          if test -f output/alertas/consulta.json; then
            python - <<'PY'
          import json,os
          r=json.load(open('output/alertas/consulta.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('Publicação elegível:',r['publicar'],file=f)
              print('Aviso:',r['eventos'][:1],file=f)
              print('Fontes:',{k:v['status'] for k,v in r['oficiais']['fontes'].items()},file=f)
          PY
          fi
      - name: Sem risco validado - não publicar
        if: steps.consulta.outputs.publicar != 'true'
        run: echo 'Sem risco corroborado; não haverá vídeo ou postagem.' >> "$GITHUB_STEP_SUMMARY"
      - name: Instalar estúdio
        if: steps.consulta.outputs.publicar == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libpango1.0-dev libcairo2-dev pkg-config
          pip install -r requirements/test.txt -r requirements/characters.txt
      - uses: ./.github/actions/setup-hyperframes
        if: steps.consulta.outputs.publicar == 'true'
      - name: Coletar snapshot atual para o cenário do RJ
        if: steps.consulta.outputs.publicar == 'true'
        run: python -m scripts.collect_live output/alertas/snapshot.json --tier 1
      - name: Renderizar no estúdio Bia RJ
        if: steps.consulta.outputs.publicar == 'true'
        run: python -m tools.render_alerta_14h
      - name: Criar URL temporária para Meta
        id: release
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="alerta-rj-$GITHUB_RUN_ID"
          gh release create "$tag" output/alertas/ALERTA.mp4 output/alertas/CAPA.jpg --title "$tag" --notes "Plantão meteorológico verificado"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ALERTA.mp4" >> "$GITHUB_OUTPUT"
      - name: Publicar Reel e Story com recibos
        id: publicar
        if: steps.release.outcome == 'success'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m tools.publicar_alerta_14h --video-url "${{ steps.release.outputs.url }}"
      - name: Persistir recibos
        if: always() && steps.release.outcome == 'success'
        run: |
          test -f data/alertas_14h_publicados.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/alertas_14h_publicados.json
          git diff --cached --quiet && exit 0
          git commit -m 'Recibos alerta RJ [skip ci]'
          git pull --rebase
          git push
      - name: Limpar URL temporária após dupla confirmação
        if: steps.publicar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.release.outputs.tag }}" --cleanup-tag --yes
      - name: Guardar consulta vídeo e recibos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerta-rj-${{ github.run_id }}
          path: |
            output/alertas/
            data/alertas_14h_publicados.json
          if-no-files-found: warn
          retention-days: 3
