name: Historico de snapshots — Previsão RJ

# Coleta agendada, SEM publicacao. Guarda cada snapshot em data/snapshots/ para
# alimentar o criterio de consistencia temporal (secao 5.2) e, mais adiante, a
# comparacao previsao x observado (secao 7). Nao toca no Instagram.
#
# O resumo mede o CONTRASTE entre as zonas: e esse numero que diz se o dia tem
# pauta de "Chove onde?" / "Dois Rios" ou se o Rio inteiro esta igual.

on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 America/Sao_Paulo
    - cron: "0 21 * * *"   # 18:00 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previsao-rj-historico
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Dependencias
        run: pip install -r requirements/test.txt

      - name: Isolamento e testes
        run: |
          python scripts/isolation_guard.py
          python -m pytest -q

      - name: Localizar o snapshot anterior
        id: anterior
        run: |
          mkdir -p data/snapshots
          ULTIMO=$(ls -1 data/snapshots/*.json 2>/dev/null | sort | tail -1 || true)
          echo "arquivo=$ULTIMO" >> "$GITHUB_OUTPUT"
          echo "anterior: ${ULTIMO:-nenhum}"

      - name: Coletar e normalizar
        run: |
          ARGS=""
          if [ -n "${{ steps.anterior.outputs.arquivo }}" ]; then
            ARGS="--previous ${{ steps.anterior.outputs.arquivo }}"
          fi
          python -m scripts.collect_live output/snapshot.json --tier 1 $ARGS

      - name: Guardar no historico
        run: |
          CARIMBO=$(TZ=America/Sao_Paulo date +%Y-%m-%d-%H%M)
          cp output/snapshot.json "data/snapshots/$CARIMBO.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "nada novo para guardar"
          else
            git commit -m "Snapshot $CARIMBO"
            git push
          fi

      - name: Resumo com o contraste do dia
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          d = json.load(open('output/snapshot.json', encoding='utf-8'))
          c = d['confidence']
          locs = d['forecast']['today']['locations']
          maxs = [e['max_c'] for e in locs]
          probs = [e['rain_probability_pct'] for e in locs]
          dt, dp = max(maxs) - min(maxs), max(probs) - min(probs)
          hist = len(glob.glob('data/snapshots/*.json'))
          print(f"## {d['forecast']['today']['date']} — {hist} snapshots no historico\n")
          print(f"- modelo principal: `{d['forecast']['primary_model']}`")
          print(f"- confianca: **{c['score']}/100** ({c['level']})")
          print(f"- consistencia temporal: {c['parts']['temporal_consistency']}/15")
          print(f"- **contraste termico entre zonas: {dt} C** ({min(maxs)}..{max(maxs)})")
          print(f"- **contraste de chuva entre zonas: {dp} p.p.** ({min(probs)}..{max(probs)})")
          pauta = "SIM" if dt >= 4 or dp >= 30 else "nao"
          print(f"- dia com pauta de contraste: **{pauta}**\n")
          print("| local | zona | min | max | chuva |")
          print("|---|---|---|---|---|")
          for e in locs:
              print(f"| {e['name']} | {e['zone']} | {e['min_c']}° | {e['max_c']}° | {e['rain_probability_pct']}% |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: output/snapshot.json
          retention-days: 30
