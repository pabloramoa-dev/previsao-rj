name: Reel manual — Previsão RJ

# Disparo na mão: teste técnico, Reel fora de hora e resgate quando o diário
# falhou. O Reel de todo dia é o `reel_manha.yml`.
#
# O agendamento de uma vez só do primeiro Reel real (07:07 de 13/09/2026) foi
# removido: a data passou, ele nunca chegou a disparar — o cron do GitHub
# engoliu a execução — e o Reel acabou publicado por disparo manual às 12:16.
#
# Aqui vale a mesma regra do diário: UMA pauta decide formato, apresentador,
# legenda e item da fila. Fixture nunca publica.

on:
  workflow_dispatch:
    inputs:
      fonte:
        description: "Fonte do Reel"
        type: choice
        options: [fixture, live]
        default: fixture
      personagem:
        description: "Apresentador — 'auto' segue o turno (Bira de manhã, Bia à noite)"
        type: choice
        options: [auto, bira, bia]
        default: auto
      turno:
        description: "Pauta ao vivo — manhã = previsão do dia; noite = previsão de amanhã"
        type: choice
        options: [manha, noite]
        default: manha
      publicar:
        description: "Publicar no @previsaorj? Desmarcado = somente artifact"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: previsao-rj-publicacao
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FONTE: ${{ inputs.fonte }}
      PUBLICAR: ${{ inputs.publicar }}
      # Colagem de papel (vox) por padrão; variable PREVISAO_RJ_ESTILO=classico volta.
      PREVISAO_RJ_ESTILO: ${{ vars.PREVISAO_RJ_ESTILO || 'vox' }}
    steps:
      # Sempre a ponta da main, e NÃO o commit do disparo: um agendamento
      # atrasado que ficou esperando na fila de concorrência carregaria a fila
      # editorial antiga (sem o Reel que acabou de sair) e as três travas
      # deixariam passar um Reel repetido.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libpango1.0-dev libcairo2-dev pkg-config
          mkdir -p ~/.local/share/fonts/poppins
          for f in Poppins-Bold.ttf Poppins-Regular.ttf; do
            curl -fsSL --retry 3 -o ~/.local/share/fonts/poppins/$f https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/$f
          done
          fc-cache -f
          pip install -r requirements/test.txt -r requirements/characters.txt

      - name: Isolamento e testes
        run: |
          python scripts/isolation_guard.py
          python -m pytest -q

      - name: Bloquear publicação com fixture
        if: ${{ env.PUBLICAR == 'true' && env.FONTE != 'live' }}
        run: |
          echo "PUBLICAÇÃO BLOQUEADA: dados de fixture nunca vão para o feed."
          exit 1

      # ------------------------------------------------------------- fixture

      - name: Usar fixture técnica
        if: ${{ env.FONTE == 'fixture' }}
        run: |
          mkdir -p output
          cp tests/fixtures/snapshot_rj.json output/snapshot.json

      - name: Demonstração sem previsão de produção
        if: ${{ env.FONTE == 'fixture' }}
        run: |
          P="${{ inputs.personagem }}"
          if [ "$P" = "auto" ]; then P=bira; fi
          python -m src.previsao_rj.render.characters.pipeline --demo --personagem "$P" --out output/REEL.mp4

      # ---------------------------------------------------------------- live

      - name: Coletar dados ao vivo
        if: ${{ env.FONTE == 'live' }}
        run: python -m scripts.collect_live output/snapshot.json

      - name: Avaliar pautas e atualizar a fila
        if: ${{ env.FONTE == 'live' }}
        run: python -m scripts.editorial_scan output/snapshot.json --out data/editorial_queue.json

      # Ficar sem pauta aqui é erro, não silêncio: quem apertou o botão precisa
      # saber que não há Reel e por quê, em vez de receber um artifact vazio.
      - name: Escolher a pauta
        id: pauta
        if: ${{ env.FONTE == 'live' }}
        run: |
          python -m scripts.escolher_pauta \
            --queue data/editorial_queue.json \
            --out output/pauta.json \
            --turno "${{ inputs.turno }}" \
            --exigir-pauta

      - name: Render com a pauta escolhida
        if: ${{ env.FONTE == 'live' }}
        run: |
          P="${{ inputs.personagem }}"
          if [ "$P" = "auto" ]; then P="${{ steps.pauta.outputs.personagem }}"; fi
          python -m src.previsao_rj.render.characters.pipeline \
            --snapshot output/snapshot.json \
            --personagem "$P" \
            --format "${{ steps.pauta.outputs.formato }}" \
            --topico "${{ steps.pauta.outputs.topico }}" \
            --out output/REEL.mp4

      # ------------------------------------------------------ comum aos dois

      - name: Legenda
        run: |
          if [ -f output/pauta.json ]; then
            python -m scripts.build_caption output/snapshot.json output/LEGENDA.txt --pauta output/pauta.json
          else
            python -m scripts.build_caption output/snapshot.json output/LEGENDA.txt
          fi

      - name: Mostrar pauta, roteiro e legenda no resumo
        run: |
          {
            echo "## Pauta"
            echo "- fonte: \`${{ inputs.fonte }}\`"
            echo "- formato: \`${{ steps.pauta.outputs.formato || 'demonstração' }}\`"
            echo "- apresentador: \`${{ steps.pauta.outputs.personagem || inputs.personagem }}\`"
            echo "- dedupe_key: \`${{ steps.pauta.outputs.dedupe_key || '—' }}\`"
            echo '## Legenda'
            echo '```'
            cat output/LEGENDA.txt 2>/dev/null || echo '(sem legenda)'
            echo '```'
            echo '## Roteiro falado'
            echo '```'
            cat output/work_*/roteiro.txt 2>/dev/null || echo '(sem roteiro)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: QA
        run: python scripts/qa_video.py output/REEL.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: previsao-rj-reel-${{ github.run_id }}
          path: output/
          retention-days: 14

      # ---------------------------------------------------------- publicação

      - name: Verificar Meta e conta de destino
        if: ${{ env.PUBLICAR == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: previsaorj
        run: python -c "from src.previsao_rj.publish.instagram import verify_destination; print('destino:',verify_destination().get('username'))"

      - name: Exigir repositório público para Release usado pela Meta
        if: ${{ env.PUBLICAR == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh repo view "${{ github.repository }}" --json visibility -q .visibility)
          test "$V" = "PUBLIC" || { echo "PUBLICAÇÃO BLOQUEADA: Release de repo privado não é URL pública para a Meta."; exit 1; }

      - name: Hospedar MP4 em Release temporário
        if: ${{ env.PUBLICAR == 'true' }}
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-${{ github.run_id }}"
          gh release create "$TAG" output/REEL.mp4 --title "$TAG" --notes "Reel manual @previsaorj"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/REEL.mp4" >> "$GITHUB_OUTPUT"

      - name: Publicar Reel controlado
        if: ${{ env.PUBLICAR == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          EXPECTED_IG_USERNAME: previsaorj
        run: |
          python -m src.previsao_rj.publish.cli \
            --video-url "${{ steps.media.outputs.url }}" \
            --caption-file output/LEGENDA.txt \
            --queue data/editorial_queue.json \
            --dedupe-key "${{ steps.pauta.outputs.dedupe_key }}" \
            --publish

      - name: Persistir a fila no repositorio
        if: ${{ always() && env.PUBLICAR == 'true' && env.FONTE == 'live' }}
        run: |
          set -euo pipefail
          test -f data/editorial_queue.json || { echo "sem fila para persistir"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_queue.json
          if git diff --cached --quiet; then
            echo "fila sem mudanca"
            exit 0
          fi
          git commit -m "Fila editorial: estado apos execucao ${{ github.run_id }}"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
